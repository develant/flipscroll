<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
    <!-- Rounded blue background -->
    <rect width="64" height="64" rx="14" fill="#1F3C88"/>

    <!-- Brick wall, white, slightly inset and centred -->
    <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="13" y="13" width="34" height="34" rx="3"/>
        <line x1="13" y1="24.5" x2="47" y2="24.5"/>
        <line x1="13" y1="35.5" x2="47" y2="35.5"/>
        <line x1="24" y1="13" x2="24" y2="24.5"/>
        <line x1="36" y1="24.5" x2="36" y2="35.5"/>
        <line x1="24" y1="35.5" x2="24" y2="47"/>
    </g>

    <!-- Cursor, orange, bottom-right overlapping the brick edge -->
    <g transform="translate(38 36)">
        <path d="M0 0 L20 8 L10.5 10.5 L8 20 Z"
              fill="#FF7A00"
              stroke="#1F3C88"
              stroke-width="1.8"
              stroke-linejoin="round"/>
    </g>
</svg>
